name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: casetech_cms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.2'
          tools: composer
          extensions: intl, json, mbstring, mysqlnd, xml, sqlite3
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: composer.json validity
        run: composer validate --strict

      - name: Prepare test environment
        # CodeIgniter's DotEnv only lets a job-level `env:` override apply
        # to a key that ISN'T already set in .env (Config/DotEnv.php calls
        # getenv($name, true), which only sees prior putenv() calls within
        # this same process — a real env var from the workflow YAML never
        # counts, so .env.example's own committed values would silently
        # win over any env: block on the steps below). Patch .env directly
        # instead: point both the default group (used by `spark migrate`,
        # which has no reliable way to target a named group without
        # ENVIRONMENT=testing — reserved for PHPUnit, see the next step's
        # comment) and the tests group (used by PHPUnit) at the CI MySQL
        # service over TCP. 127.0.0.1, not localhost: MySQL treats
        # "localhost" as a unix-socket hint, which doesn't exist in this
        # Docker service container.
        run: |
          cp .env.example .env
          php spark key:generate --force
          sed -i \
            -e "s/^database\.default\.hostname = .*/database.default.hostname = 127.0.0.1/" \
            -e "s/^database\.default\.database = .*/database.default.database = casetech_cms_test/" \
            -e "s/^database\.tests\.hostname = .*/database.tests.hostname = 127.0.0.1/" \
            -e "s/^database\.tests\.database = .*/database.tests.database = casetech_cms_test/" \
            .env

      - name: Run migrations (up + rollback + up, against MySQL)
        # Targets the "default" group (see .env patch above), not "tests":
        # ENVIRONMENT=testing is reserved for PHPUnit
        # (app/Config/Boot/testing.php) and crashes a plain spark
        # invocation outside phpunit's bootstrap (it assumes SUPPORTPATH
        # is already defined, which only tests/bootstrap.php sets).
        # migrate:rollback also has no -g/group flag to target a specific
        # group directly, so the default group is the only one both
        # migrate and migrate:rollback can reliably reach here.
        run: |
          php spark migrate --all
          php spark migrate:rollback --all
          php spark migrate --all

      - name: Run test suite
        if: hashFiles('tests/**/*Test.php') != ''
        run: vendor/bin/phpunit

  build:
    name: Build production artifact
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.2'
          tools: composer
          extensions: intl, json, mbstring, mysqlnd, xml

      - name: Install production dependencies only
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader --classmap-authoritative

      - name: Assemble deploy artifact
        # See docs/deployment.md §3 for the full exclude rationale.
        run: |
          mkdir -p /tmp/release
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='tests' --exclude='docs' \
            --exclude='.env' --exclude='.env.*' --exclude='phpunit*' --exclude='.phpunit.cache' \
            --exclude='.vscode' --exclude='.idea' --exclude='writable/uploads' \
            --exclude='writable/cache' --exclude='writable/logs' --exclude='writable/session' \
            --exclude='writable/backup_tmp' --exclude='writable/debugbar' \
            ./ /tmp/release/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: release
          path: /tmp/release
          retention-days: 5
